trigger:
  - main

pool:
  name: 'Default' # Replace with your self-hosted runner pool name

variables:
  - group: EMA # Reference the variable group with AWS_ACCESS_KEY and AWS_SECRET_KEY

steps:
  - script: |
      echo "Verifying AWS CLI version..."
      aws --version
      echo "Checking AWS credentials..."
      aws sts get-caller-identity
    displayName: 'Verify AWS Credentials'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_KEY)
    condition: succeeded()
